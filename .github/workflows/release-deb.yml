name: Release do pacote .deb

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Conferir se a tag corresponde à versão do projeto
        run: |
          versao="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$versao" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $versao do pyproject.toml"
            exit 1
          fi

      - name: Gerar o pacote
        run: empacotamento/construir-deb.sh

      - name: Testar a instalação
        run: empacotamento/testar-deb.sh

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --verify-tag --generate-notes

[project]
name = "gblinux"
version = "0.1.1"
description = "Assinador de PDF com token A3 ICP-Brasil para Linux"
readme = "README.md"
authors = [
    { name = "renatormc", email = "renatomartinsrmc@gmail.com" }
]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
    "pyhanko>=0.38.1",
    "pykcs11>=1.5.21",
    "pyside6-essentials>=6.12.0",
    "requests>=2.34.2",
]

[project.scripts]
gblinux = "gblinux:main"
testar-assinatura = "gblinux.testar:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
